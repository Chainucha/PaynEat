server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ชื่อไฟล์ของ Flutter Web ไม่เปลี่ยนตามเนื้อหา (main.dart.js, canvaskit.wasm ฯลฯ ชื่อเดิมทุก build)
    # จึงห้าม cache แบบหมดอายุช้า — เดิม expires 7d ทำให้เครื่องที่เคยเปิดค้างแอปรุ่นเก่าได้ถึง 7 วันหลังอัปเดต
    # no-cache = ใช้ของใน cache ได้ แต่ถามเซิร์ฟเวอร์ก่อนทุกครั้ง (ETag) ไฟล์ไม่เปลี่ยนได้ 304 แทบไม่เสียเวลา
    # (docs/DECISIONS.md #97)
    add_header Cache-Control "no-cache" always;

    # Flutter Web เป็น SPA — ทุก path ต้องตกมาที่ index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # canvaskit.wasm (~5.5MB) และฟอนต์ (~3.4MB) เป็นส่วนใหญ่ของการเปิดครั้งแรก เดิมไม่ถูกบีบอัดเลย
    # gzip_proxied any: หลัง reverse proxy/Cloudflare คำขอมี header Via ซึ่งค่าเริ่มต้นของ nginx จะไม่ gzip ให้
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               image/svg+xml application/wasm font/ttf font/otf application/octet-stream;
}
