name: payneat_pos
description: "PaynEat POS — แอปหน้าร้านสำหรับพนักงานเสิร์ฟ ครัว แคชเชียร์ และเว็บผู้ดูแลระบบ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # ข้อความมาตรฐานของ Material (ปฏิทิน, ปุ่มคัดลอก/วาง, tooltip ย้อนกลับ) ตามภาษาแอป
  # ดึง intl เวอร์ชันที่ SDK ล็อกไว้ — ข้อจำกัด intl ด้านล่างต้องยอมรับเวอร์ชันนั้นเสมอ
  flutter_localizations:
    sdk: flutter

  # State management + DI + routing
  get: ^4.7.2

  # HTTP client
  dio: ^5.7.0

  # Local key-value storage (เก็บ token / session)
  get_storage: ^2.1.1

  # Realtime กับฝั่ง backend (Socket.IO)
  socket_io_client: ^3.1.2

  # จัดรูปแบบวันที่ / ตัวเลข / สกุลเงิน
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # สร้างคำสั่ง ESC/POS สำหรับพิมพ์ใบเสร็จจริงผ่านเครื่องพิมพ์ความร้อน (LAN/WiFi)
  esc_pos_utils_plus: ^2.0.4

  # เลือกรูปเมนูจากกล้อง/คลังภาพ — รองรับทั้ง Android, iOS และเว็บในตัวเดียว
  # และย่อรูปให้ตั้งแต่ตอนเลือก (รูปจากกล้องมือถือใหญ่เกินกว่าจะเก็บเป็น data URL ดิบ ๆ)
  # จำกัดเพดานไว้ที่ <1.2.3 เพราะ 1.2.3 ต้องการ Dart ^3.10.0 แต่ Flutter 3.35.1 ที่ CI
  # ล็อกไว้ (.github/workflows/ci.yml) มาพร้อม Dart 3.9.0 เท่านั้น — ยกเพดานได้เมื่ออัปเดต Flutter/CI
  image_picker: ">=1.2.0 <1.2.3"
  qr_flutter: ^4.1.0
  web: ^1.1.1

  # สแกนบาร์โค้ด/ฉลากตาชั่งด้วยกล้องมือถือ (docs/tickets/22-live-scale-camera-scan.md) — Android/iOS/
  # เว็บในแพ็กเกจเดียว (เว็บใช้ getUserMedia ต้องเปิดผ่าน HTTPS หรือ localhost)
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # กฎ lint เฉพาะของโปรเจกต์ (ดู tool/lints) — รันด้วย `dart run custom_lint`
  # และขึ้นเส้นหยักใน IDE ให้เห็นตั้งแต่ตอนพิมพ์
  custom_lint: ^0.8.1
  payneat_lints:
    path: tool/lints

flutter:
  uses-material-design: true

  # ฝังฟอนต์ไทยไปกับแอป ไม่พึ่งฟอนต์เริ่มต้นของแต่ละแพลตฟอร์ม
  # (Roboto/San Francisco ไม่ได้ออกแบบมาสำหรับสระและวรรณยุกต์ไทยโดยเฉพาะ
  #  ทำให้ระยะห่างเพี้ยนและหน้าตาไม่ตรงกันระหว่าง Android / iOS / เว็บ)
  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansThai-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansThai-700.ttf
          weight: 700
        - asset: assets/fonts/NotoSansThai-800.ttf
          weight: 800

  # ฟอนต์สำรองสำหรับอักษรเกาหลี (NotoSansKR, KS X 1001 ครบ ~800KB ต่อน้ำหนัก ดู DECISIONS #74)
  # เป็น asset ธรรมดา ไม่อยู่ใน `fonts:` ข้างบน เพราะทุกไฟล์ใน `fonts:` ถูกโหลดก่อนเฟรมแรกบนเว็บ
  # KoreanFontService ลงทะเบียนเองตอนรัน (DECISIONS #97)
  assets:
    - assets/fonts/NotoSansKR-400.ttf
    - assets/fonts/NotoSansKR-500.ttf
    - assets/fonts/NotoSansKR-700.ttf
    - assets/fonts/NotoSansKR-800.ttf
