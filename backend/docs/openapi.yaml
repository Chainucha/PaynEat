openapi: 3.0.3
info:
  title: PaynEat POS API
  version: 1.0.0
  description: |
    REST API + Realtime (Socket.IO) สำหรับระบบ POS ร้านอาหาร

    **บัญชีเดโม**
    | บทบาท | username | password |
    |---|---|---|
    | ผู้ดูแลระบบ | `admin` | `admin123` |
    | ผู้จัดการ | `manager` | `manager123` |
    | พนักงานเสิร์ฟ | `waiter1` | `waiter123` |
    | ครัว | `kitchen` | `kitchen123` |
    | แคชเชียร์ | `cashier` | `cashier123` |

    ทุก endpoint (ยกเว้น `/auth/login` และ `/health`) ต้องส่ง `Authorization: Bearer <token>`
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: Auth
  - name: Branches
  - name: Users
  - name: Categories
  - name: Menu
  - name: Ingredients
  - name: Tables
  - name: Orders
  - name: Promotions
  - name: Payments
  - name: Shifts
  - name: Reports
  - name: Settings
  - name: TaxInvoices
  - name: AuditLogs
  - name: Customers
  - name: AiAssistant
  - name: PublicOrder
  - name: Receivables
  - name: Scale
    description: ตาชั่งต่อสาย อ่านน้ำหนักสด (ดู docs/tickets/22-live-scale-camera-scan.md)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string, example: ไม่พบข้อมูลที่ต้องการ }
            requestId:
              type: string
              example: pos-3fa2c1d09b7e4a55
              description: >-
                รหัสเดียวกับ response header `x-request-id` และ `labels.correlation_id` ในทุกบรรทัด log
                ของคำขอนี้ (สัญญา telemetry, ticket 24) — ส่ง `x-request-id` ที่ตรง `^[\w-]{8,64}$` มาเองได้
                ไม่ส่ง/ไม่ตรงรูปแบบ เซิร์ฟเวอร์สร้างให้
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    User:
      type: object
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, example: น้องฝน (พนักงานเสิร์ฟ) }
        username: { type: string, example: waiter1 }
        role: { type: string, enum: [admin, manager, waiter, cashier, kitchen] }
        isActive: { type: boolean }
        branchId: { type: integer, nullable: true, description: 'สาขาที่ token นี้ทำงานอยู่ — null เฉพาะ admin โหมด "ทุกสาขา" (ticket 11)' }
        branchName: { type: string, nullable: true }
    Branch:
      type: object
      description: สาขา (ดู ticket 11 — multi-branch)
      properties:
        id: { type: integer }
        name: { type: string, example: สาขาสุขุมวิท }
        code: { type: string, nullable: true, example: SUKHUMVIT }
        address: { type: string, nullable: true }
        isActive: { type: boolean }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: อาหารจานเดียว }
        nameEn: { type: string, example: Rice & Noodles }
        icon: { type: string, example: 🍛 }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        itemCount: { type: integer }
    MenuOption:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: ไข่ดาว }
        priceDelta: { type: number, example: 15 }
        isDefault: { type: boolean }
    MenuOptionGroup:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: ระดับความเผ็ด }
        minSelect: { type: integer }
        maxSelect: { type: integer }
        isRequired: { type: boolean }
        options:
          type: array
          items: { $ref: '#/components/schemas/MenuOption' }
    MenuItemIngredient:
      type: object
      description: วัตถุดิบที่ผูกกับเมนูนี้ + ปริมาณที่ใช้ต่อ 1 ที่
      properties:
        ingredientId: { type: integer }
        ingredientName: { type: string, example: กุ้งสด }
        unit: { type: string, example: กรัม }
        qtyPerUnit: { type: number, example: 80 }
    MenuItem:
      type: object
      properties:
        id: { type: integer }
        categoryId: { type: integer }
        categoryName: { type: string }
        name: { type: string, example: ผัดกะเพราหมูสับ }
        nameEn: { type: string }
        description: { type: string }
        price: { type: number, example: 75 }
        imageUrl: { type: string, nullable: true }
        isAvailable: { type: boolean }
        isRecommended: { type: boolean }
        prepMinutes: { type: integer }
        optionGroups:
          type: array
          items: { $ref: '#/components/schemas/MenuOptionGroup' }
        ingredients:
          type: array
          description: วัตถุดิบที่ผูกไว้ — ระบบตัดสต๊อกอัตโนมัติเมื่อขาย (ดู ticket 06)
          items: { $ref: '#/components/schemas/MenuItemIngredient' }
        soldByWeight:
          type: boolean
          description: >-
            ขายตามน้ำหนัก (ดู ticket 18) — price คือบาทต่อกิโลกรัม สั่งต้องส่ง weightGrams และวัตถุดิบที่ผูก
            คิดเป็นปริมาณต่อ 1 กก. ไม่แสดงในเมนู QR สั่งเอง
        barcode:
          type: string
          nullable: true
          example: '8850999320014'
          description: บาร์โค้ดสินค้า (ตัวเลข/อังกฤษ/ขีด ≤ 32) ไม่ซ้ำในสาขาเดียวกัน ส่ง '' เพื่อล้าง (ดู ticket 19)
        scalePlu:
          type: string
          nullable: true
          example: '101'
          description: รหัสสินค้าบนฉลากตาชั่ง 1–6 หลัก เก็บแบบตัด 0 นำหน้า ใช้ได้เฉพาะเมนูขายตามน้ำหนัก
    Ingredient:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: กุ้งสด }
        unit: { type: string, example: กรัม, description: หน่วยนับอิสระที่ร้านตั้งเอง }
        currentStock: { type: number, example: 3000 }
        lowStockThreshold: { type: number, example: 500 }
        isLowStock: { type: boolean, description: 'currentStock <= lowStockThreshold' }
    TaxInvoice:
      type: object
      description: ใบกำกับภาษี (ดู ticket 07) — snapshot ข้อมูลร้าน+ยอดเงิน ณ เวลาที่ออก
      properties:
        id: { type: integer }
        orderId: { type: integer }
        orderCode: { type: string, example: ORD-20260101-0001 }
        runningNumber: { type: string, example: INV69-000001, description: 'รีเซ็ตทุกปี พ.ศ.' }
        invoiceType: { type: string, enum: [abbreviated, full] }
        customerName: { type: string, nullable: true }
        customerAddress: { type: string, nullable: true }
        customerTaxId: { type: string, nullable: true }
        storeName: { type: string }
        storeTaxId: { type: string }
        storeAddress: { type: string }
        storeBranch: { type: string, nullable: true }
        subtotal: { type: number }
        vat: { type: number }
        total: { type: number }
        issuedBy: { type: integer }
        issuedByName: { type: string }
        issuedAt: { type: string, format: date-time }
        isVoid: { type: boolean }
        voidedAt: { type: string, format: date-time, nullable: true }
        voidReason: { type: string, nullable: true }
        voidedBy: { type: integer, nullable: true }
        voidedByName: { type: string, nullable: true }
    AuditLog:
      type: object
      description: |
        รายการ audit log (ดู ticket 08) — append-only, ไม่มี endpoint แก้ไข/ลบ
        บันทึกอย่างน้อย: ยกเลิกออเดอร์, ยกเลิกรายการหลังส่งครัว, แก้ไขส่วนลด, ปิดใช้งาน/ลบ/เปลี่ยนสิทธิ์/
        ตั้งรหัสผ่านใหม่ให้พนักงาน, แก้ค่า VAT/ค่าบริการ, คืนเงิน, ยกเลิกใบกำกับภาษี
      properties:
        id: { type: integer }
        actorUserId: { type: integer, nullable: true, description: null ถ้าผู้ทำถูกลบบัญชีไปแล้ว }
        actorName: { type: string, example: ผู้จัดการสาขา, description: snapshot ชื่อผู้ทำไว้ตอนบันทึก }
        action:
          type: string
          example: order.cancel
          enum:
            [
              order.cancel,
              order_item.void,
              order.discount,
              user.deactivate,
              user.delete,
              user.role_change,
              user.password_reset,
              settings.update,
              payment.refund,
              tax_invoice.void,
            ]
        entityType: { type: string, example: order }
        entityId: { type: integer, nullable: true }
        summary: { type: string, example: 'ยกเลิกออเดอร์ #ORD-20260101-0001' }
        reason: { type: string, nullable: true }
        metadata:
          type: object
          nullable: true
          description: >-
            รายละเอียดก่อน/หลังแบบ structured — มี `summaryArgs` เสมอสำหรับ log ที่เขียนหลัง
            DECISIONS #74: ค่าที่ใช้ประกอบ `summary` แบบไม่ผูกภาษา (ชื่อ เลขที่ ยอดเป็นบาท รหัสสถานะ)
            ให้ไคลเอนต์แสดงประโยคเป็นภาษาของผู้ดู `summary` ยังเป็นภาษาไทยเหมือนเดิม
        createdAt: { type: string, format: date-time }
    Table:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: A1 }
        zone: { type: string, example: โซนในร้าน }
        seats: { type: integer }
        status: { type: string, enum: [available, occupied, reserved, billing] }
        branchId: { type: integer, nullable: true, description: 'ticket 11 — multi-branch' }
        qrToken:
          type: string
          format: uuid
          description: >-
            token สุ่มสำหรับ URL สั่งอาหารเอง (ticket 17) — เห็นได้ทุก role ที่เข้าถึงหน้าผังโต๊ะ
            เปลี่ยนใหม่ได้ด้วย PATCH /tables/{id}/qr-token/regenerate
        currentOrder:
          nullable: true
          type: object
          properties:
            id: { type: integer }
            code: { type: string }
            status: { type: string }
            total: { type: number }
    OrderItem:
      type: object
      properties:
        id: { type: integer }
        menuItemId: { type: integer }
        name: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        options:
          type: array
          items: { $ref: '#/components/schemas/MenuOption' }
        optionsPrice: { type: number }
        lineTotal: { type: number }
        note: { type: string, nullable: true }
        status: { type: string, enum: [pending, cooking, ready, served, cancelled] }
        isPaid: { type: boolean, description: จ่ายไปแล้วในรอบแยกบิลรายการอาหารหรือยัง }
        weightGrams:
          type: integer
          nullable: true
          example: 485
          description: >-
            น้ำหนักที่ชั่งได้ (กรัม) ของสินค้าขายตามน้ำหนัก — quantity เป็น 1 เสมอ และ lineTotal =
            round((unitPrice + optionsPrice) สตางค์ × weightGrams / 1000) (ดู ticket 18, DECISIONS #48)
    PublicOrderPreview:
      type: object
      description: >-
        ticket 17 — เวอร์ชันตัดฟิลด์ของ Order ที่ไม่ต้องให้ลูกค้าเห็น (ชื่อ/เบอร์โทรลูกค้าที่ผูกไว้,
        ชื่อพนักงานเสิร์ฟ) เหลือแค่รายการ/ยอดที่ลูกค้าต้องใช้ตรวจสอบออเดอร์ตัวเอง
      properties:
        id: { type: integer }
        code: { type: string, example: ORD-20260907-0001 }
        status: { type: string, enum: [open, in_kitchen, served] }
        subtotal: { type: number }
        discountAmount: { type: number }
        promotionName: { type: string, nullable: true }
        promotionDiscountAmount: { type: number }
        serviceCharge: { type: number }
        vat: { type: number }
        total: { type: number }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
    Order:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: ORD-20260907-0001 }
        type: { type: string, enum: [dine_in, takeaway, delivery] }
        tableId: { type: integer, nullable: true }
        tableName: { type: string, nullable: true }
        queueNumber:
          type: integer
          nullable: true
          example: 3
          description: เลขคิวรับอาหาร รันต่อวัน — มีเฉพาะออเดอร์ type=takeaway เท่านั้น (ดู ticket 10)
        waiterName: { type: string, nullable: true }
        customerId: { type: integer, nullable: true, description: ผูกลูกค้าแบบ optional (ดู ticket 09) }
        customerName: { type: string, nullable: true }
        customerPhone: { type: string, nullable: true }
        pointsEarned:
          type: integer
          example: 0
          description: >-
            แต้มสะสมที่ลูกค้าได้รับจากออเดอร์นี้ — จ่ายด้วยเงินจริง: ตั้งครั้งเดียวตอนจ่ายครบ ·
            มีส่วนขายเชื่อ: 0 จนกว่ารับชำระหนี้ครบ แล้วคิดจากยอดสุทธิหลังลดหนี้ (ไม่รวมดอกเบี้ย)
            ยกเลิกใบเสร็จรับชำระแล้วบิลกลับมาค้าง = ดึงแต้มคืนเท่าที่ลูกค้ายังมี (DECISIONS #59)
        guestCount: { type: integer }
        status: { type: string, enum: [open, in_kitchen, served, paid, cancelled] }
        subtotal: { type: number, example: 180 }
        discountType: { type: string, enum: [none, amount, percent] }
        discountAmount: { type: number }
        promotionId: { type: integer, nullable: true }
        promotionName: { type: string, nullable: true }
        promotionCode: { type: string, nullable: true }
        promotionDiscountAmount: { type: number }
        serviceCharge: { type: number, example: 18 }
        vat: { type: number, example: 13.86 }
        total: { type: number, example: 211.86 }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
    PromotionConditions:
      type: object
      properties:
        daysOfWeek: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        startTime: { type: string, example: '14:00', nullable: true }
        endTime: { type: string, example: '17:00', nullable: true }
        categoryIds: { type: array, items: { type: integer } }
        menuItemIds: { type: array, items: { type: integer } }
        minSubtotal: { type: number, example: 300 }
    Promotion:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: 'Happy Hour ลด 15%' }
        type: { type: string, enum: [percent, amount, bogo] }
        value: { type: number, example: 15 }
        code: { type: string, nullable: true, example: SAVE20 }
        conditions: { $ref: '#/components/schemas/PromotionConditions' }
        isActive: { type: boolean }
        validFrom: { type: string, nullable: true, example: '2026-01-01' }
        validTo: { type: string, nullable: true, example: '2026-12-31' }
    Payment:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: integer }
        method: { type: string, enum: [cash, qr, card, transfer, credit] }
        amount: { type: number }
        received: { type: number }
        dueDate:
          type: string
          format: date
          nullable: true
          description: วันครบกำหนดของบิลขายเชื่อ (method = credit) = วันนี้ + เครดิตเทอมของลูกค้า (ดู ticket 20)
        change: { type: number }
        reference: { type: string, nullable: true }
        pointsRedeemed: { type: integer, example: 0, description: แต้มสะสมที่ใช้แลกส่วนลดรอบจ่ายนี้ }
        pointsRedeemedValue: { type: number, example: 0, description: มูลค่าส่วนลดจากแต้ม (บาท) }
    Customer:
      type: object
      description: ลูกค้า/สมาชิก + แต้มสะสม (ดู docs/tickets/09-customer-loyalty.md)
      properties:
        id: { type: integer }
        name: { type: string, example: คุณสมหญิง ใจดี }
        phone: { type: string, example: '0812345678' }
        email: { type: string, nullable: true }
        pointsBalance: { type: integer, example: 120 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        creditLimit: { type: number, example: 50000, description: วงเงินขายเชื่อ — 0 = ขายเชื่อไม่ได้ (ดู ticket 20) }
        creditTermDays: { type: integer, example: 30 }
        taxId: { type: string, nullable: true, example: '0105561234567' }
        address: { type: string, nullable: true }
        creditOutstanding:
          type: number
          description: ยอดค้างชำระ ณ ตอนดึง — มีเฉพาะ GET /customers/{id}
        creditAvailable:
          type: number
          description: วงเงินที่ยังใช้ได้ — มีเฉพาะ GET /customers/{id}
    ReceivableSummary:
      type: object
      description: บัญชีลูกหนี้ของลูกค้าหนึ่งราย (ดู ticket 20)
      properties:
        customer: { $ref: '#/components/schemas/Customer' }
        creditLimit: { type: number }
        creditTermDays: { type: integer }
        outstanding: { type: number, description: ยอดบิล − คืนเงิน − ยอดที่ตัดด้วยใบเสร็จที่ยังไม่ยกเลิก }
        overdue: { type: number }
        available: { type: number }
        openInvoiceCount: { type: integer }
        oldestDueDate: { type: string, format: date, nullable: true }
        aging:
          type: object
          properties:
            current: { type: number }
            days1to30: { type: number }
            days31to60: { type: number }
            days61to90: { type: number }
            over90: { type: number }
    DocumentLine:
      type: object
      properties:
        paymentId: { type: integer }
        orderCode: { type: string }
        amount: { type: number }
        createdAt: { type: string, format: date-time }
        dueDate: { type: string, format: date }
    ArReceipt:
      type: object
      description: ใบเสร็จรับชำระหนี้ — เงินสดต้องมีกะเปิดอยู่และนับเข้ายอดที่ควรมีตอนปิดกะ
      properties:
        id: { type: integer }
        receiptNo: { type: string, example: RC69-000001 }
        customerId: { type: integer }
        customerName: { type: string }
        amount: { type: number }
        method: { type: string, enum: [cash, qr, card, transfer] }
        reference: { type: string, nullable: true }
        shiftId: { type: integer, nullable: true }
        receivedAt: { type: string, format: date-time }
        isVoided: { type: boolean }
        voidReason: { type: string, nullable: true }
        allocations:
          type: array
          description: บิลที่ใบเสร็จนี้ตัดชำระ (เก่าสุดก่อน)
          items: { $ref: '#/components/schemas/DocumentLine' }
    BillingNote:
      type: object
      description: ใบวางบิล — total คงที่ ณ วันออก, remaining/status คำนวณสด
      properties:
        id: { type: integer }
        noteNo: { type: string, example: BN69-000001 }
        customerId: { type: integer }
        customerName: { type: string }
        total: { type: number }
        remaining: { type: number }
        status: { type: string, enum: [open, paid, void] }
        dueDate: { type: string, format: date }
        issuedAt: { type: string, format: date-time }
        isVoided: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/DocumentLine' }
        emails:
          type: array
          description: ประวัติการส่งทางอีเมล (มีเฉพาะตอนดึงแบบเอกสารเต็ม)
          items: { $ref: '#/components/schemas/DocumentEmail' }
    DocumentEmail:
      type: object
      properties:
        to: { type: string, format: email }
        subject: { type: string }
        sentByName: { type: string, nullable: true }
        sentAt: { type: string, format: date-time }
    LateFeeLine:
      type: object
      properties:
        paymentId: { type: integer }
        orderCode: { type: string }
        dueDate: { type: string, format: date }
        principal: { type: number, description: เงินต้นที่ยังค้าง = min(ยอดบิลหลังลดหนี้, ยอดค้าง) }
        periodFrom: { type: string, format: date }
        periodTo: { type: string, format: date }
        days: { type: integer }
        amount: { type: number, description: round(principal × annualRate × days / 36500) }
    LateFeeCharge:
      type: object
      description: ใบแจ้งดอกเบี้ยผิดนัด — ยอดบวกเข้ายอดค้างของแต่ละบิล ยกเลิก = ยกเว้นดอกเบี้ย (ticket 21)
      properties:
        id: { type: integer }
        chargeNo: { type: string, example: LF69-000001 }
        customerId: { type: integer }
        customerName: { type: string }
        total: { type: number }
        annualRate: { type: number, example: 12 }
        asOf: { type: string, format: date }
        note: { type: string, nullable: true }
        isVoided: { type: boolean }
        voidReason: { type: string, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/LateFeeLine' }
    CreditNote:
      type: object
      description: ใบลดหนี้ — ออกอัตโนมัติทุกครั้งที่คืนเงินบิลขายเชื่อ ยกเลิกไม่ได้ (ticket 21)
      properties:
        id: { type: integer }
        noteNo: { type: string, example: CN69-000001 }
        customerId: { type: integer }
        paymentId: { type: integer }
        refundId: { type: integer }
        orderCode: { type: string }
        originalAmount: { type: number, description: มูลค่าตามบิลเดิม }
        previousCredited: { type: number, description: ลดหนี้ไปแล้วก่อนหน้า }
        correctAmount: { type: number, description: มูลค่าที่ถูกต้องหลังลดครั้งนี้ }
        amount: { type: number, description: ผลต่าง (รวม VAT) }
        vatAmount: { type: number, description: VAT ของผลต่างตามสัดส่วน VAT ในบิลเดิม }
        baseAmount: { type: number }
        taxInvoiceNo: { type: string, nullable: true, description: เลขใบกำกับภาษีเดิมที่อ้างถึง }
        reason: { type: string }
    ScaleStatus:
      type: object
      properties:
        enabled: { type: boolean, description: false = SCALE_DRIVER=off }
        driver: { type: string, enum: [off, tcp, serial, simulator] }
        connected: { type: boolean }
        error: { type: string, nullable: true }
        reading:
          type: object
          nullable: true
          description: null เมื่อยังไม่มีค่า/ค่าเก่ากว่า 3 วินาที/สายหลุด
          properties:
            grams: { type: integer, example: 485 }
            stable: { type: boolean, description: ใช้คิดเงินได้เฉพาะตอน true }
            overload: { type: boolean }
            at: { type: string, format: date-time }

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: เข้าสู่ระบบ
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: waiter1 }
                password: { type: string, example: waiter123 }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
        '401':
          description: username หรือรหัสผ่านไม่ถูกต้อง
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
      description: >-
        ถ้า user มีสิทธิ์เข้ามากกว่า 1 สาขา (ดู ticket 11) จะได้ `needsBranchSelection: true`,
        `pendingToken`, และ `branches` แทน `token`/`user` — ต้องเรียก POST /auth/select-branch
        ด้วย pendingToken ก่อนถึงจะได้ token ที่ใช้งานได้จริง (admin เข้าสาขาแรกอัตโนมัติเสมอ
        ไม่ต้องเลือก)
  /auth/select-branch:
    post:
      tags: [Auth]
      summary: เลือก/สลับสาขาที่จะทำงาน (ticket 11)
      description: >-
        รับได้ทั้ง pendingToken จาก login ครั้งแรก (มีหลายสาขา) และ token ปกติที่ login แล้ว
        (สลับสาขาภายหลัง) — branchId เป็น null ได้เฉพาะ admin เท่านั้น (โหมด "ทุกสาขา" ดูรายงาน
        รวมทุกสาขา)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId]
              properties:
                branchId: { type: integer, nullable: true }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
        '403': { description: ไม่มีสิทธิ์เข้าถึงสาขานี้ (หรือไม่ใช่ admin แต่ขอโหมด "ทุกสาขา") }
  /auth/me:
    get:
      tags: [Auth]
      summary: ข้อมูลผู้ใช้ปัจจุบัน
      responses:
        '200': { description: สำเร็จ }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: เปลี่ยนรหัสผ่านของตัวเอง
      responses:
        '200': { description: สำเร็จ }

  /branches:
    get:
      tags: [Branches]
      summary: รายชื่อสาขาทั้งหมด (admin เท่านั้น — ดู ticket 11)
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Branch' }
    post:
      tags: [Branches]
      summary: สร้างสาขาใหม่ (admin เท่านั้น)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Branch' }
      responses:
        '201': { description: สร้างสำเร็จ }
  /branches/mine:
    get:
      tags: [Branches]
      summary: สาขาที่ผู้ใช้ปัจจุบันมีสิทธิ์เข้าถึง (ทุก role เรียกได้ — ใช้ตอนเลือก/สลับสาขา)
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Branch' }
  /branches/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Branches]
      summary: รายละเอียดสาขา (admin เท่านั้น)
      responses:
        '200': { description: สำเร็จ }
    patch:
      tags: [Branches]
      summary: แก้ไข/ปิดใช้งานสาขา (admin เท่านั้น) — ปิดแล้ว token ที่ผูกกับสาขานี้ใช้ต่อไม่ได้ทันที
      responses:
        '200': { description: สำเร็จ }

  /users:
    get:
      tags: [Users]
      summary: รายชื่อพนักงาน (admin/manager)
      responses:
        '200': { description: สำเร็จ }
    post:
      tags: [Users]
      summary: เพิ่มพนักงาน (admin/manager)
      responses:
        '201': { description: สร้างสำเร็จ }
  /users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Users]
      summary: ข้อมูลพนักงานรายคน
      responses:
        '200': { description: สำเร็จ }
    patch:
      tags: [Users]
      summary: แก้ไขพนักงาน
      responses:
        '200': { description: สำเร็จ }
    delete:
      tags: [Users]
      summary: ลบพนักงาน (admin)
      responses:
        '204': { description: ลบแล้ว }

  /categories:
    get:
      tags: [Categories]
      summary: รายการหมวดหมู่
      responses:
        '200': { description: สำเร็จ }
    post:
      tags: [Categories]
      summary: เพิ่มหมวดหมู่ (admin/manager)
      responses:
        '201': { description: สร้างสำเร็จ }
  /categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      tags: [Categories]
      summary: แก้ไขหมวดหมู่
      responses:
        '200': { description: สำเร็จ }
    delete:
      tags: [Categories]
      summary: ลบหมวดหมู่ (ต้องไม่มีเมนูค้างอยู่)
      responses:
        '204': { description: ลบแล้ว }

  /promotions:
    get:
      tags: [Promotions]
      summary: รายการโปรโมชัน
      parameters:
        - { in: query, name: activeOnly, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Promotion' }
    post:
      tags: [Promotions]
      summary: เพิ่มโปรโมชัน (admin/manager) — บันทึก audit log ทุกครั้ง (ดู ticket 14)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Promotion' }
      responses:
        '201': { description: สร้างสำเร็จ }
        '409': { description: โค้ดนี้มีโปรโมชันอื่นใช้อยู่แล้ว }
  /promotions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Promotions]
      summary: รายละเอียดโปรโมชัน
      responses:
        '200': { description: สำเร็จ }
    patch:
      tags: [Promotions]
      summary: แก้ไขโปรโมชัน (admin/manager) — บันทึก audit log ทุกครั้ง (ดู ticket 14)
      responses:
        '200': { description: สำเร็จ }
    delete:
      tags: [Promotions]
      summary: >-
        ลบโปรโมชัน (admin/manager) — ออเดอร์ที่เคยใช้ไปแล้วยังเก็บชื่อ/โค้ดไว้ (snapshot) ไม่กระทบ
        บันทึก audit log ทุกครั้ง (ดู ticket 14)
      responses:
        '204': { description: ลบแล้ว }

  /menu-items:
    get:
      tags: [Menu]
      summary: รายการเมนู (ค้นหา/กรองตามหมวดหมู่ได้)
      parameters:
        - { in: query, name: categoryId, schema: { type: integer } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: availableOnly, schema: { type: string, enum: ['true', 'false'] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 100 } }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MenuItem' }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
    post:
      tags: [Menu]
      summary: เพิ่มเมนู พร้อมกลุ่มตัวเลือก (admin/manager)
      responses:
        '201': { description: สร้างสำเร็จ }
  /menu-items/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Menu]
      summary: รายละเอียดเมนู
      responses:
        '200': { description: สำเร็จ }
    patch:
      tags: [Menu]
      summary: >-
        แก้ไขเมนู — แก้ราคาที่เปลี่ยนจริง (ไม่ใช่แก้ field อื่น) บันทึก audit log อัตโนมัติ
        (ดู ticket 14)
      responses:
        '200': { description: สำเร็จ }
    delete:
      tags: [Menu]
      summary: ลบเมนู
      responses:
        '204': { description: ลบแล้ว }
  /menu-items/{id}/availability:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      tags: [Menu]
      summary: เปิด/ปิดการขายเมนู (ของหมด)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isAvailable: { type: boolean }
      responses:
        '200': { description: สำเร็จ }

  /ingredients:
    get:
      tags: [Ingredients]
      summary: รายการวัตถุดิบ
      parameters:
        - { in: query, name: lowStockOnly, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Ingredient' }
    post:
      tags: [Ingredients]
      summary: เพิ่มวัตถุดิบใหม่ (admin/manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Ingredient' }
      responses:
        '201': { description: สร้างสำเร็จ }
  /ingredients/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Ingredients]
      summary: รายละเอียดวัตถุดิบ
      responses:
        '200': { description: สำเร็จ }
    patch:
      tags: [Ingredients]
      summary: แก้ชื่อ/หน่วยนับ/threshold (admin/manager) — แก้ currentStock ตรง ๆ ไม่ได้ ต้องผ่าน adjust-stock
      responses:
        '200': { description: สำเร็จ }
    delete:
      tags: [Ingredients]
      summary: ลบวัตถุดิบ (admin/manager) — ลบไม่ได้ถ้ายังผูกกับเมนูอยู่
      responses:
        '204': { description: ลบแล้ว }
        '409': { description: ยังถูกผูกกับเมนูอยู่ }
  /ingredients/{id}/adjust-stock:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      tags: [Ingredients]
      summary: >-
        ปรับสต๊อกมือ (รับของเข้า/ตัดของเสีย) (admin/manager) — sync สถานะเปิด/ปิดขายเมนูที่เกี่ยวข้อง
        อัตโนมัติ บันทึก audit log ทุกครั้งพร้อมเหตุผลจากช่อง note (ดู ticket 14)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta]
              properties:
                delta: { type: number, example: 500, description: 'บวก = เติมสต๊อก, ลบ = หัก/ของเสีย ห้ามเป็น 0' }
                note: { type: string, nullable: true }
      responses:
        '200': { description: สำเร็จ }
        '422': { description: delta เป็น 0 }

  /tables:
    get:
      tags: [Tables]
      summary: ผังโต๊ะพร้อมออเดอร์ที่เปิดอยู่
      parameters:
        - { in: query, name: zone, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [available, occupied, reserved, billing] } }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Table' }
    post:
      tags: [Tables]
      summary: เพิ่มโต๊ะ (admin/manager)
      responses:
        '201': { description: สร้างสำเร็จ }
  /tables/zones:
    get:
      tags: [Tables]
      summary: รายชื่อโซนทั้งหมด
      responses:
        '200': { description: สำเร็จ }
  /tables/{id}/status:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      tags: [Tables]
      summary: เปลี่ยนสถานะโต๊ะ (จอง/ว่าง/เรียกเก็บเงิน)
      responses:
        '200': { description: สำเร็จ }
  /tables/{id}/qr-token/regenerate:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      tags: [Tables]
      summary: >-
        เปลี่ยน QR ของโต๊ะ (admin/manager) — ticket 17. ใช้เมื่อ QR สติกเกอร์หลุดหาย/ถูกแชร์ออกไป
        token เก่าใช้เรียก /public/tables/{qrToken} ต่อไม่ได้ทันที
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Table' }
        '403': { description: ไม่ใช่ admin/manager }

  /orders:
    get:
      tags: [Orders]
      summary: รายการออเดอร์
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [open, in_kitchen, served, paid, cancelled] } }
        - { in: query, name: activeOnly, schema: { type: string, enum: ['true', 'false'] } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - { in: query, name: customerId, schema: { type: integer }, description: กรองออเดอร์ของลูกค้ารายนี้ (ดู ticket 09) }
      responses:
        '200': { description: สำเร็จ }
    post:
      tags: [Orders]
      summary: เปิดออเดอร์ใหม่
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [dine_in, takeaway, delivery], default: dine_in }
                tableId: { type: integer }
                customerId: { type: integer, description: ผูกลูกค้าแบบ optional (ดู ticket 09) }
                guestCount: { type: integer, default: 1 }
                note: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      menuItemId: { type: integer }
                      quantity: { type: integer, description: สินค้าขายตามน้ำหนักต้องเป็น 1 }
                      weightGrams:
                        type: integer
                        minimum: 1
                        maximum: 99999
                        description: บังคับสำหรับเมนูขายตามน้ำหนัก ห้ามส่งกับเมนูชิ้น (ดู ticket 18)
                      optionIds:
                        type: array
                        items: { type: integer }
                      note: { type: string }
      responses:
        '201':
          description: สร้างสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Order' }
        '409':
          description: โต๊ะนี้มีออเดอร์เปิดอยู่แล้ว
  /orders/kitchen/queue:
    get:
      tags: [Orders]
      summary: คิวครัว (KDS) — รายการที่ส่งครัวแล้วและยังไม่เสิร์ฟ
      parameters:
        - in: query
          name: status
          description: คั่นด้วย , เช่น `pending,cooking`
          schema: { type: string }
      responses:
        '200': { description: สำเร็จ }
  /orders/table/{id}/open:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Orders]
      summary: ออเดอร์ที่เปิดอยู่ของโต๊ะนี้
      responses:
        '200': { description: สำเร็จ (คืน null ถ้าไม่มี) }
  /orders/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Orders]
      summary: รายละเอียดออเดอร์
      responses:
        '200': { description: สำเร็จ }
    patch:
      tags: [Orders]
      summary: แก้ไขจำนวนลูกค้า / โน้ต
      responses:
        '200': { description: สำเร็จ }
  /orders/{id}/items:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      tags: [Orders]
      summary: เพิ่มรายการอาหาร (สั่งเพิ่มรอบสอง)
      responses:
        '201': { description: เพิ่มสำเร็จ }
  /orders/{id}/items/{itemId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: itemId, required: true, schema: { type: integer } }
    patch:
      tags: [Orders]
      summary: แก้จำนวน/โน้ต (เฉพาะรายการที่ครัวยังไม่เริ่มทำ)
      responses:
        '200': { description: สำเร็จ }
        '409': { description: ครัวเริ่มทำแล้ว }
    delete:
      tags: [Orders]
      summary: ลบรายการ (เฉพาะที่ครัวยังไม่เริ่มทำ)
      responses:
        '200': { description: สำเร็จ }
  /orders/{id}/items/{itemId}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: itemId, required: true, schema: { type: integer } }
    patch:
      tags: [Orders]
      summary: อัปเดตสถานะรายการ (pending → cooking → ready → served)
      responses:
        '200': { description: สำเร็จ }
        '409': { description: เปลี่ยนสถานะข้ามขั้นไม่ได้ }
  /orders/{id}/send-to-kitchen:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      tags: [Orders]
      summary: ส่งออเดอร์เข้าครัว (ยิง event `kitchen:ticket`)
      responses:
        '200': { description: สำเร็จ }
  /orders/{id}/discount:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      tags: [Orders]
      summary: ให้ส่วนลด (บาท หรือ %)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [none, amount, percent] }
                value: { type: number, example: 10 }
      responses:
        '200': { description: สำเร็จ }
  /orders/{id}/promotion/redeem:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      tags: [Orders]
      summary: >-
        กรอกโค้ดส่วนลด — ผูกโปรโมชันนี้กับออเดอร์ถ้าเข้าเงื่อนไข บันทึก audit log ทุกครั้ง
        (ดู ticket 14)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, example: SAVE20 }
      responses:
        '200': { description: สำเร็จ }
        '404': { description: ไม่พบโค้ดนี้ }
        '400': { description: ไม่เข้าเงื่อนไขของโค้ดนี้ (ยอดขั้นต่ำ/เมนู/ช่วงเวลา ฯลฯ) }
  /orders/{id}/promotion:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    delete:
      tags: [Orders]
      summary: >-
        เอาโปรโมชันที่ผูกด้วยโค้ดออก (โปรโมชัน auto ที่ยังเข้าเงื่อนไขจะกลับมาเอง) บันทึก
        audit log ทุกครั้ง (ดู ticket 14)
      responses:
        '200': { description: สำเร็จ }
  /orders/{id}/eligible-promotions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Orders]
      summary: โปรโมชันที่เข้าเงื่อนไขกับบิลนี้ตอนนี้ (ทั้งแบบ auto และแบบใช้โค้ด)
      responses:
        '200': { description: สำเร็จ }
  /orders/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      tags: [Orders]
      summary: ยกเลิกออเดอร์ (admin/manager)
      responses:
        '200': { description: สำเร็จ }
  /orders/{id}/move-table:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      tags: [Orders]
      summary: ย้ายออเดอร์ (ที่ยังไม่ปิดบิล) ไปโต๊ะอื่น
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableId]
              properties:
                tableId: { type: integer }
      responses:
        '200': { description: สำเร็จ — ปลดโต๊ะเก่าเป็นว่าง จองโต๊ะใหม่ }
        '409': { description: โต๊ะปลายทางมีออเดอร์ที่เปิดอยู่แล้ว }
  /orders/{id}/merge:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, description: id ของออเดอร์ปลายทาง }
    post:
      tags: [Orders]
      summary: รวมออเดอร์ต้นทางเข้ากับออเดอร์ปลายทาง (ใช้ตอนรวมโต๊ะ/รวมบิล)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceOrderId]
              properties:
                sourceOrderId: { type: integer }
      responses:
        '200':
          description: สำเร็จ — รายการอาหารทั้งหมดย้ายไปออเดอร์ปลายทาง ต้นทางถูกยกเลิกและปลดโต๊ะ
        '400': { description: เลือกออเดอร์ปลายทางเดียวกับต้นทาง }

  /payments:
    post:
      tags: [Payments]
      summary: ชำระเงิน (รองรับแยกจ่ายหลายวิธี) — บันทึก audit log ทุกครั้ง (ดู ticket 14)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, method]
              description: >-
                ระบุอย่างใดอย่างหนึ่ง — amount (จ่ายเป็นจำนวนเงิน) หรือ itemIds
                (แยกบิลรายการอาหาร ระบบคำนวณยอดเองจากรายการที่เลือก)
              properties:
                orderId: { type: integer }
                method:
                  type: string
                  enum: [cash, qr, card, transfer, credit]
                  description: >-
                    credit = ขายเชื่อ (ดู ticket 20) — ออเดอร์ต้องผูกลูกค้าที่มีวงเงินพอ, ผู้ทำรายการไม่ใช่
                    waiter (403), ใช้ร่วมกับ pointsToRedeem ไม่ได้, เกินวงเงินได้ 409
                amount: { type: number, example: 211.86 }
                itemIds:
                  type: array
                  items: { type: integer }
                  description: id ของ order item ที่จะจ่ายรอบนี้ (แยกบิลรายการอาหาร)
                received: { type: number, example: 300, description: จำเป็นเมื่อจ่ายเงินสด }
                reference: { type: string }
                pointsToRedeem:
                  type: integer
                  example: 0
                  description: >-
                    ใช้แต้มสะสมแลกส่วนลดรอบจ่ายนี้ (ดู ticket 09) — ต้องมีลูกค้าผูกกับออเดอร์นี้อยู่
                    แล้ว มูลค่าคำนวณจาก settings.pointsRedeemValueBaht ต้องไม่เกินยอดที่ต้องชำระ
                    รอบนี้และไม่เกินแต้มคงเหลือของลูกค้า
      responses:
        '201':
          description: บันทึกการชำระเงินสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      payment: { $ref: '#/components/schemas/Payment' }
                      order: { $ref: '#/components/schemas/Order' }
                      isFullyPaid: { type: boolean }
                      remaining: { type: number }
  /payments/{id}/refund:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: id ของ payment ที่จะคืนเงิน
    post:
      tags: [Payments]
      summary: คืนเงินหลังชำระเงินแล้ว (เต็มจำนวนหรือบางส่วน — manager ขึ้นไป)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { type: number, example: 50, description: ต้องไม่เกินยอดที่ยังคืนได้ของ payment นี้ }
                reason: { type: string, example: ลูกค้าคืนอาหารบางส่วน }
      responses:
        '201':
          description: บันทึกการคืนเงินสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      refund: { type: object }
                      order: { $ref: '#/components/schemas/Order' }
        '400': { description: คืนเงินเกินยอดที่ยังคืนได้ของ payment นี้ }
        '404': { description: ไม่พบรายการชำระเงินนี้ }
        '409':
          description: >-
            คืนเป็นเงินสดแต่ยังไม่มีกะเปิดอยู่ — เงินสดที่คืนต้องออกจากลิ้นชักของกะที่เปิดอยู่ตอนคืน
            และถูกหักออกจากยอดที่คาดไว้ตอนปิดกะนั้น (docs/DECISIONS.md #44) คืนผ่าน QR/บัตร/โอน
            ไม่ต้องมีกะ
  /payments/order/{id}/split-preview:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      tags: [Payments]
      summary: ดูยอดที่ต้องจ่ายล่วงหน้าก่อนแยกบิลรายการอาหารจริง (ไม่ตัดจ่าย)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds:
                  type: array
                  items: { type: integer }
      responses:
        '200': { description: สำเร็จ }
  /payments/order/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Payments]
      summary: สรุปยอดชำระ/ค้างชำระของออเดอร์
      responses:
        '200': { description: สำเร็จ }
  /payments/order/{id}/receipt:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Payments]
      summary: ข้อมูลใบเสร็จสำหรับพิมพ์
      responses:
        '200': { description: สำเร็จ }
  /payments/promptpay-qr:
    get:
      tags: [Payments]
      summary: >-
        payload สำหรับสร้าง QR พร้อมเพย์จริง (มาตรฐาน EMV QRCPS) ให้ client เรนเดอร์เป็นภาพ QR เอง
        — ไม่ระบุ amount ได้ static QR ที่ลูกค้ากรอกยอดเองตอนสแกน ดู docs/tickets/16-promptpay-qr.md
      parameters:
        - in: query
          name: amount
          schema: { type: number, minimum: 0.01, example: 176.55 }
          description: ยอดที่ต้องการให้ QR ระบุไว้ (ไม่ใส่ = static QR ไม่ผูกยอด)
      responses:
        '200': { description: สำเร็จ }
        '400': { description: ร้านยังไม่ได้ตั้งค่าเลขพร้อมเพย์ (ตั้งได้ที่หน้าตั้งค่าระบบ) }

  /shifts/current:
    get:
      tags: [Shifts]
      summary: กะที่เปิดอยู่ตอนนี้ (ถ้ามี) — admin/manager/cashier
      responses:
        '200': { description: สำเร็จ (data เป็น null ถ้าไม่มีกะเปิดอยู่) }
  /shifts:
    get:
      tags: [Shifts]
      summary: ประวัติกะย้อนหลัง
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: สำเร็จ }
    post:
      tags: [Shifts]
      summary: เปิดกะใหม่ พร้อมเงินทอนตั้งต้น — บันทึก audit log ทุกครั้ง (ดู ticket 14)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openingCash]
              properties:
                openingCash: { type: number, minimum: 0, example: 2000 }
      responses:
        '201': { description: เปิดกะสำเร็จ }
        '409': { description: มีกะเปิดอยู่แล้ว ต้องปิดก่อนเปิดกะใหม่ }
  /shifts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Shifts]
      summary: รายละเอียดกะ
      responses:
        '200': { description: สำเร็จ }
  /shifts/{id}/close:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      tags: [Shifts]
      summary: >-
        ปิดกะ — นับเงินสดจริงเทียบกับยอดที่ระบบคาดไว้ (กระทบยอด) บันทึก audit log ทุกครั้ง
        พร้อมส่วนต่างเงินสด (ดู ticket 14)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countedCash]
              properties:
                countedCash: { type: number, minimum: 0, example: 5230 }
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: ปิดกะสำเร็จ (data มี expectedCash/countedCash/difference ให้เทียบ)

  /reports/dashboard:
    get:
      tags: [Reports]
      summary: ข้อมูลสรุปหน้า Dashboard (ยอดวันนี้ + รายชั่วโมง + เมนูขายดี + ตัวนับสด)
      responses:
        '200': { description: สำเร็จ }
  /reports/summary:
    get:
      tags: [Reports]
      summary: สรุปยอดขายตามช่วงวันที่
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: สำเร็จ }
  /reports/top-items:
    get:
      tags: [Reports]
      summary: เมนูขายดี — สินค้าขายตามน้ำหนักมี weightKg (น้ำหนักรวม) เพิ่ม quantity คือจำนวนถุง
      responses:
        '200': { description: สำเร็จ }
  /reports/sales-by-day:
    get:
      tags: [Reports]
      summary: ยอดขายรายวัน
      responses:
        '200': { description: สำเร็จ }
  /reports/export/summary:
    get:
      tags: [Reports]
      summary: >-
        export สรุปยอดขาย (ตามช่วงวันที่) เป็น CSV ให้ฝ่ายบัญชี (ดู
        docs/tickets/12-report-export.md) — ตัวเลขเดียวกับ GET /reports/summary เป๊ะ ต่างกันแค่
        format ที่ตอบกลับ (แถวแบบ รายการ,มูลค่า)
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200':
          description: ไฟล์ CSV (UTF-8 พร้อม BOM ให้ Excel เปิดแล้วอักษรไทยไม่เพี้ยน)
          content:
            text/csv:
              schema: { type: string }
  /reports/export/top-items:
    get:
      tags: [Reports]
      summary: export เมนูขายดี (ตามช่วงวันที่) เป็น CSV
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: limit, schema: { type: integer, default: 10 } }
      responses:
        '200':
          description: ไฟล์ CSV
          content:
            text/csv:
              schema: { type: string }
  /reports/export/sales-by-day:
    get:
      tags: [Reports]
      summary: export ยอดขายรายวัน (ตามช่วงวันที่) เป็น CSV
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200':
          description: ไฟล์ CSV
          content:
            text/csv:
              schema: { type: string }
  /reports/z-report/by-shift/{shiftId}:
    get:
      tags: [Reports]
      summary: >-
        Z-report ต่อกะ (ดู docs/tickets/12-report-export.md, docs/tickets/01-shift-cash-reconciliation.md)
        — สรุปยอดขาย/ภาษี/ส่วนลด/ช่องทางชำระเงินเฉพาะออเดอร์ที่จ่ายจริงในกะนี้ (ผูกผ่าน
        payments.shift_id ไม่ใช่วันที่เปิดออเดอร์) พร้อมกระทบยอดเงินสด (opening/expected/counted/variance)
        — receivableReceipts แยกยอดรับชำระหนี้ตามช่องทาง (เงินสดนับรวมใน expected แล้ว ดู ticket 20)
      parameters:
        - { in: path, name: shiftId, required: true, schema: { type: integer } }
      responses:
        '200': { description: สำเร็จ }
        '404': { description: ไม่พบกะนี้ }
  /reports/z-report/by-shift/{shiftId}/export:
    get:
      tags: [Reports]
      summary: export Z-report ต่อกะเป็น CSV
      parameters:
        - { in: path, name: shiftId, required: true, schema: { type: integer } }
      responses:
        '200':
          description: ไฟล์ CSV
          content:
            text/csv:
              schema: { type: string }
        '404': { description: ไม่พบกะนี้ }
  /reports/z-report/by-date:
    get:
      tags: [Reports]
      summary: >-
        Z-report ต่อวัน (รวมทุกกะของวันนั้น) — ไม่มีส่วนกระทบยอดเงินสด เพราะอาจมีหลายกะ/หลาย
        แคชเชียร์ปะปนกันในวันเดียว (กระทบยอดเงินสดทำได้เฉพาะระดับกะเดียวเท่านั้น ดู by-shift)
      parameters:
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        '200': { description: สำเร็จ }
  /reports/z-report/by-date/export:
    get:
      tags: [Reports]
      summary: export Z-report ต่อวันเป็น CSV
      parameters:
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        '200':
          description: ไฟล์ CSV
          content:
            text/csv:
              schema: { type: string }

  /settings:
    get:
      tags: [Settings]
      summary: >-
        ค่าตั้งค่าร้าน (VAT, Service Charge, ชื่อร้าน, เลขผู้เสียภาษี/ที่อยู่/สาขาสำหรับใบกำกับภาษี,
        อัตราแต้มสะสม, เลขพร้อมเพย์)
      responses:
        '200': { description: สำเร็จ }
    patch:
      tags: [Settings]
      summary: >-
        แก้ไขค่าตั้งค่าร้าน (admin/manager) — storeTaxId/storeAddress/storeBranch ต้องตั้งก่อนออก
        ใบกำกับภาษีได้ — pointsEarnRateBaht/pointsRedeemValueBaht คุมอัตราแต้มสะสม (ดู ticket 09)
        — promptPayId ต้องตั้งก่อนช่องทางจ่าย "qr" จะแสดง QR จริงได้ (ดู ticket 16)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pointsEarnRateBaht:
                  type: number
                  example: 25
                  description: จ่ายครบกี่บาทได้ 1 แต้ม (ค่าเริ่มต้น 25)
                pointsRedeemValueBaht:
                  type: number
                  example: 1
                  description: มูลค่า 1 แต้มตอนใช้แลกส่วนลด เป็นบาท (ค่าเริ่มต้น 1)
                promptPayId:
                  type: string
                  example: '0812345678'
                  description: เบอร์โทร/เลขบัตรประชาชน/เลขผู้เสียภาษีที่ผูกกับพร้อมเพย์ของร้าน
                scaleLabelPrefix:
                  type: string
                  example: '20'
                  description: prefix ของฉลากตาชั่ง EAN-13 ขึ้นต้นด้วย 2 ยาว 1–3 หลัก (ดู ticket 19)
                scaleLabelPluDigits:
                  type: integer
                  enum: [4, 5, 6]
                  example: 5
                  description: >-
                    จำนวนหลักของ PLU บนฉลาก — prefix + PLU ต้องเหลือหลักน้ำหนัก 4–6 หลัก ไม่งั้น 400
                    (ตรวจเทียบค่าที่บันทึกไว้ด้วยเมื่อส่งมาแค่ช่องเดียว)
                lateFeeAnnualRatePercent:
                  type: number
                  minimum: 0
                  maximum: 15
                  example: 12
                  description: ดอกเบี้ยผิดนัด % ต่อปี (0 = ไม่คิด ค่าเริ่มต้น) เปลี่ยนแล้วบันทึก audit log (ticket 21)
                lateFeeGraceDays:
                  type: integer
                  minimum: 0
                  maximum: 365
                  description: วันผ่อนผันหลังครบกำหนดก่อนเริ่มคิดดอกเบี้ย
      responses:
        '200': { description: สำเร็จ }

  /tax-invoices/order/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: order id
    get:
      tags: [TaxInvoices]
      summary: ใบกำกับภาษีที่ยัง active อยู่ของออเดอร์นี้ (ถ้ามี)
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/TaxInvoice' }
        '404': { description: ยังไม่มีใบกำกับภาษีสำหรับออเดอร์นี้ }
    post:
      tags: [TaxInvoices]
      summary: ออกใบกำกับภาษี (admin/manager/cashier/waiter) — ออเดอร์ต้องชำระเงินครบแล้วเท่านั้น
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceType]
              properties:
                invoiceType: { type: string, enum: [abbreviated, full] }
                customerName: { type: string, description: บังคับถ้า invoiceType = full }
                customerAddress: { type: string, description: บังคับถ้า invoiceType = full }
                customerTaxId: { type: string, nullable: true, description: ไม่บังคับแม้เป็น full }
      responses:
        '201': { description: ออกสำเร็จ }
        '400': { description: 'ยังไม่ได้ตั้งค่าเลขผู้เสียภาษี/ที่อยู่ร้าน หรือข้อมูลเต็มรูปไม่ครบ' }
        '409': { description: ออเดอร์ยังไม่จ่ายครบ หรือมีใบกำกับภาษี active อยู่แล้ว }
  /tax-invoices/order/{id}/void:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
        description: order id
    post:
      tags: [TaxInvoices]
      summary: ยกเลิกใบกำกับภาษีที่ออกผิด (admin/manager เท่านั้น) — เลขที่รันไปแล้วจะไม่ถูกใช้ซ้ำ ออกใบใหม่แทนได้ทันที
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: ยกเลิกสำเร็จ }
        '404': { description: ยังไม่มีใบกำกับภาษีที่ยกเลิกได้ }

  /audit-logs:
    get:
      tags: [AuditLogs]
      summary: ประวัติ audit log ทั้งหมด (admin เท่านั้น) — filter ตามผู้ใช้/action/ประเภท/ช่วงเวลาได้
      parameters:
        - { in: query, name: actorUserId, schema: { type: integer } }
        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: entityType, schema: { type: string } }
        - { in: query, name: entityId, schema: { type: integer } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        '403': { description: สิทธิ์ไม่พอ (ต้องเป็น admin) }
  /audit-logs/export:
    get:
      tags: [AuditLogs]
      summary: >-
        export audit log เป็นไฟล์ CSV (admin เท่านั้น) — filter เดียวกับ GET /audit-logs แต่ไม่มี
        pagination (ดึงทุกแถวที่ตรงเงื่อนไข) สำหรับส่งให้ฝ่ายบัญชี/ผู้ตรวจสอบภายนอก (ดู
        docs/tickets/14-financial-audit-trail.md)
      parameters:
        - { in: query, name: actorUserId, schema: { type: integer } }
        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: entityType, schema: { type: string } }
        - { in: query, name: entityId, schema: { type: integer } }
        - { in: query, name: dateFrom, schema: { type: string, format: date } }
        - { in: query, name: dateTo, schema: { type: string, format: date } }
      responses:
        '200':
          description: ไฟล์ CSV (UTF-8 พร้อม BOM ให้ Excel เปิดแล้วอักษรไทยไม่เพี้ยน)
          content:
            text/csv:
              schema: { type: string, format: binary }
        '403': { description: สิทธิ์ไม่พอ (ต้องเป็น admin) }

  /customers:
    get:
      tags: [Customers]
      summary: ค้นหา/รายการลูกค้า (ตามชื่อหรือเบอร์โทร) — ใช้ตอนเปิดออเดอร์/เช็คบิล
      parameters:
        - { in: query, name: search, schema: { type: string }, description: ค้นหาจากชื่อหรือเบอร์โทร (partial match) }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Customer' }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
    post:
      tags: [Customers]
      summary: สร้างลูกค้าใหม่
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: { type: string }
                phone: { type: string, example: '0812345678' }
                email: { type: string, nullable: true }
      responses:
        '201': { description: สร้างสำเร็จ }
        '409': { description: เบอร์โทรนี้มีลูกค้าอยู่แล้วในระบบ }
  /customers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Customers]
      summary: รายละเอียดลูกค้า (รวมแต้มสะสมคงเหลือ) — ใช้ประกอบหน้าประวัติการซื้อของ admin ร่วมกับ GET /orders?customerId=
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Customer' }
        '404': { description: ไม่พบลูกค้านี้ }
  /customers/{id}/credit:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      tags: [Customers]
      summary: ตั้งวงเงินเครดิต/เครดิตเทอม/ข้อมูลออกเอกสาร (admin/manager — บันทึก audit log customer.credit_update)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [creditLimit, creditTermDays]
              properties:
                creditLimit: { type: number, minimum: 0, maximum: 100000000 }
                creditTermDays: { type: integer, minimum: 0, maximum: 365 }
                taxId: { type: string, description: ตัวเลข 13 หลัก หรือ '' เพื่อล้าง }
                address: { type: string, maxLength: 300 }
                email:
                  type: string
                  description: อีเมลรับเอกสารลูกหนี้ (ticket 23) — ไม่ส่งมา = คงค่าเดิม, '' = ล้าง
      responses:
        '200': { description: สำเร็จ }
        '403': { description: ไม่ใช่ผู้จัดการขึ้นไป }
  /receivables/customers:
    get:
      tags: [Receivables]
      summary: รายชื่อลูกค้าเครดิตพร้อมยอดค้าง/เกินกำหนด เรียงเกินกำหนดมากสุดก่อน (admin/manager/cashier)
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReceivableSummary' }
  /receivables/customers/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Receivables]
      summary: รายการเดินบัญชีของลูกค้า — สรุป + บิลขายเชื่อทุกใบ + ใบเสร็จรับชำระ + ใบวางบิล
      responses:
        '200': { description: สำเร็จ }
        '404': { description: ไม่พบลูกค้านี้ }
  /receivables/receipts:
    post:
      tags: [Receivables]
      summary: >-
        รับชำระหนี้ — ตัดบิลเก่าสุดก่อน (ครบกำหนดก่อน → ขายก่อน) หรือเฉพาะบิลในใบวางบิลที่ระบุ
        รับเกินยอดค้างได้ 400 เงินสดต้องมีกะเปิดอยู่ (409)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, amount, method]
              properties:
                customerId: { type: integer }
                amount: { type: number, example: 1500 }
                method: { type: string, enum: [cash, qr, card, transfer] }
                reference: { type: string, maxLength: 80 }
                note: { type: string, maxLength: 300 }
                billingNoteId: { type: integer }
      responses:
        '201':
          description: ออกใบเสร็จสำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/ArReceipt' }
  /receivables/receipts/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Receivables]
      summary: ใบเสร็จรับชำระหนี้แบบเอกสารเต็ม (รวมข้อมูลร้าน/ลูกค้า)
      responses:
        '200': { description: สำเร็จ }
        '404': { description: ไม่พบใบเสร็จรับชำระนี้ }
  /receivables/receipts/{id}/void:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      tags: [Receivables]
      summary: >-
        ยกเลิกใบเสร็จรับชำระ (admin/manager) — หนี้กลับมาค้าง ใบเสร็จเงินสดยกเลิกได้เฉพาะตอนกะที่รับเงิน
        ยังเปิดอยู่ (409)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200': { description: สำเร็จ }
  /receivables/billing-notes:
    post:
      tags: [Receivables]
      summary: >-
        ออกใบวางบิล — รวบบิลค้างที่ยังไม่อยู่ในใบวางบิลอื่น (หรือเฉพาะ paymentIds) ไม่มีบิลให้รวบได้ 409
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId: { type: integer }
                paymentIds:
                  type: array
                  items: { type: integer }
                dueDate: { type: string, format: date, description: ไม่ระบุ = วันครบกำหนดที่ช้าสุดของบิลที่รวบ }
                note: { type: string, maxLength: 300 }
      responses:
        '201':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/BillingNote' }
  /receivables/billing-notes/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Receivables]
      summary: ใบวางบิลแบบเอกสารเต็ม (รวมข้อมูลร้าน/ลูกค้า)
      responses:
        '200': { description: สำเร็จ }
        '404': { description: ไม่พบใบวางบิลนี้ }
  /receivables/billing-notes/{id}/void:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      tags: [Receivables]
      summary: ยกเลิกใบวางบิล (admin/manager) — บิลในใบนี้วางบิลใหม่ได้
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200': { description: สำเร็จ }
  /receivables/customers/{id}/late-fee-preview:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Receivables]
      summary: ดูดอกเบี้ยผิดนัดที่จะคิด ณ วันนี้ (ยังไม่บันทึก) — items ว่างถ้ายังไม่ตั้งอัตราหรือไม่มีบิลที่ต้องคิด
      responses:
        '200': { description: 'สำเร็จ — { annualRate, graceDays, asOf, items: LateFeeLine[], total }' }
  /receivables/late-fees:
    post:
      tags: [Receivables]
      summary: >-
        ออกใบแจ้งดอกเบี้ยผิดนัด (admin/manager) — ยังไม่ตั้งอัตรา/ไม่มีบิลที่ต้องคิดเพิ่ม 409
        คิดถึงวันนี้แล้วกดซ้ำวันเดิมได้ 409 (ไม่ได้ดอกเบี้ยซ้ำ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId: { type: integer }
                note: { type: string, maxLength: 300 }
      responses:
        '201':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/LateFeeCharge' }
        '403': { description: ไม่ใช่ผู้จัดการขึ้นไป }
        '409': { description: ยังไม่ตั้งอัตรา / ไม่มีบิลที่ต้องคิด }
  /receivables/late-fees/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Receivables]
      summary: ใบแจ้งดอกเบี้ยแบบเอกสารเต็ม (รวมข้อมูลร้าน/ลูกค้า/ประวัติอีเมล)
      responses:
        '200': { description: สำเร็จ }
        '404': { description: ไม่พบใบแจ้งดอกเบี้ยนี้ }
  /receivables/late-fees/{id}/void:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      tags: [Receivables]
      summary: >-
        ยกเลิกใบแจ้งดอกเบี้ย = ยกเว้นดอกเบี้ย (admin/manager) — ดอกเบี้ยในใบถูกชำระแล้ว 409
        (ยกเลิกใบเสร็จรับชำระก่อน)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200': { description: สำเร็จ }
  /receivables/credit-notes:
    post:
      tags: [Receivables]
      summary: >-
        ลดหนี้บิลขายเชื่อ + ออกใบลดหนี้ (admin/manager) — ทางลัดของ POST /payments/{id}/refund ที่ตอบกลับ
        เป็นใบลดหนี้ (คืนเงินบิลขายเชื่อผ่าน endpoint เดิมก็ได้ใบลดหนี้เหมือนกัน) บิลที่ไม่ใช่ขายเชื่อ 400
        เกินยอดค้าง 400
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentId, amount, reason]
              properties:
                paymentId: { type: integer }
                amount: { type: number, example: 107 }
                reason: { type: string, maxLength: 300 }
      responses:
        '201':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/CreditNote' }
  /receivables/credit-notes/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Receivables]
      summary: ใบลดหนี้แบบเอกสารเต็ม
      responses:
        '200': { description: สำเร็จ }
        '404': { description: ไม่พบใบลดหนี้นี้ }
  /receivables/{kind}/{id}/pdf:
    parameters:
      - in: path
        name: kind
        required: true
        schema: { type: string, enum: [billing-notes, receipts, credit-notes, late-fees] }
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      tags: [Receivables]
      summary: >-
        เอกสารลูกหนี้เป็น PDF A4 ภาษาไทย (admin/manager/cashier — ticket 23) เอกสารที่ยกเลิกแล้วยังโหลดได้
        (มีตรา "ยกเลิก")
      responses:
        '200':
          description: ไฟล์ PDF (Cache-Control no-store)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: ไม่พบเอกสาร }
  /receivables/{kind}/{id}/email:
    parameters:
      - in: path
        name: kind
        required: true
        schema: { type: string, enum: [billing-notes, receipts, credit-notes, late-fees] }
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      tags: [Receivables]
      summary: >-
        ส่งเอกสารเป็น PDF แนบอีเมล (admin/manager/cashier) — ไม่ระบุ to = อีเมลของลูกค้าในบัญชีเครดิต
        บันทึกประวัติ + audit log receivable.document_email
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, format: email }
                message: { type: string, maxLength: 1000 }
      responses:
        '200': { description: 'สำเร็จ — ตอบกลับเอกสารเต็มพร้อม emails ล่าสุด' }
        '400': { description: ลูกค้าไม่มีอีเมลและไม่ได้ระบุผู้รับ }
        '409': { description: เอกสารถูกยกเลิกแล้ว }
        '502': { description: SMTP ปฏิเสธ/ต่อไม่ติด (MAIL_SEND_FAILED) — ไม่บันทึกประวัติ }
        '503': { description: ยังไม่ได้ตั้ง SMTP_HOST (MAIL_NOT_CONFIGURED) }
  /scale:
    get:
      tags: [Scale]
      summary: >-
        น้ำหนักล่าสุดจากตาชั่งที่ต่อกับเซิร์ฟเวอร์ (admin/manager/cashier/waiter) — ค่าสดต่อจากนี้ส่งทาง
        socket.io event scale:reading (รูปเดียวกัน) ตั้งตาชั่งผ่าน env SCALE_DRIVER/SCALE_TCP_*/SCALE_SERIAL_*
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/ScaleStatus' }
        '403': { description: ครัวไม่มีสิทธิ์ }
  /ai/ask:
    post:
      tags: [AiAssistant]
      summary: >-
        ถามคำถามภาษาธรรมชาติ (ไทย/อังกฤษ) เกี่ยวกับยอดขาย/เมนูขายดี/ออเดอร์/ลูกค้า/ประวัติการทำรายการ
        (admin/manager เท่านั้น) — AI ตอบจากข้อมูลจริงผ่าน tool-calling เท่านั้น ไม่แต่งตัวเลขเอง (ดู
        docs/tickets/15-ai-ask-your-data.md) จำกัดจำนวนคำถามต่อผู้ใช้ต่อวัน (AI_ASSISTANT_DAILY_LIMIT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, maxLength: 500, example: เมนูไหนขายดีสุดอาทิตย์นี้ }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      answerText: { type: string }
                      chart:
                        type: object
                        nullable: true
                        properties:
                          title: { type: string }
                          points:
                            type: array
                            items:
                              type: object
                              properties:
                                label: { type: string }
                                value: { type: number }
                      sources:
                        type: array
                        description: tool ที่ AI เรียกจริงเพื่อตอบคำถามนี้ (ตรวจสอบย้อนหลังได้)
                        items:
                          type: object
                          properties:
                            tool: { type: string }
                            args: { type: object }
                      remainingToday: { type: integer }
        '403': { description: สิทธิ์ไม่พอ (ต้องเป็น admin หรือ manager) }
        '422': { description: คำถามว่างหรือยาวเกินไป }
        '429': { description: ถามเกินโควตาต่อวันแล้ว }
        '503': { description: ยังไม่ได้ตั้งค่า ANTHROPIC_API_KEY }

  /public/tables/{qrToken}:
    parameters:
      - in: path
        name: qrToken
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [PublicOrder]
      summary: >-
        ลูกค้าสแกน QR ที่โต๊ะแล้วดูรายการที่สั่งไปแล้ว (ticket 17) — ไม่ต้อง login เลย
        ไม่มี Authorization header
      security: []
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      table:
                        type: object
                        properties:
                          id: { type: integer }
                          name: { type: string }
                          zone: { type: string }
                      branchName: { type: string, nullable: true }
                      order:
                        nullable: true
                        allOf:
                          - $ref: '#/components/schemas/PublicOrderPreview'
        '404': { description: ไม่พบโต๊ะนี้ / โต๊ะหรือสาขาปิดใช้งานอยู่ }
  /public/tables/{qrToken}/menu:
    parameters:
      - in: path
        name: qrToken
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [PublicOrder]
      summary: เมนูที่เปิดขายอยู่ของสาขาที่โต๊ะนี้สังกัด (ticket 17) — ไม่ต้อง login
      security: []
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MenuItem' }
        '404': { description: ไม่พบโต๊ะนี้ / โต๊ะหรือสาขาปิดใช้งานอยู่ }
  /public/tables/{qrToken}/items:
    parameters:
      - in: path
        name: qrToken
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [PublicOrder]
      summary: >-
        ลูกค้าสั่งอาหารเองผ่าน QR (ticket 17) — เปิดออเดอร์ใหม่ให้อัตโนมัติถ้าโต๊ะนี้ยังไม่มี
        ออเดอร์เปิดอยู่ ใช้ตรรกะเดียวกับที่พนักงานสั่งทุกประการ (ตัดสต๊อก/ประเมินโปรโมชัน/แจ้งเตือน
        เข้าจอครัวแบบเรียลไทม์) ออเดอร์ที่ยังเป็นร่าง (`open`) ถูกส่งเข้าครัวให้ทันที ลูกค้าไม่มีปุ่ม
        "ส่งเข้าครัว" แยกเหมือนพนักงาน (docs/DECISIONS.md #46) เพิ่มได้อย่างเดียว แก้ไข/ยกเลิก/จ่ายเงินต้องให้พนักงานทำแทน จำกัด
        ไม่เกิน 30 ครั้งต่อโต๊ะทุก 5 นาที (429 ถ้าเกิน)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [menuItemId, quantity]
                    properties:
                      menuItemId: { type: integer }
                      quantity: { type: integer, minimum: 1, maximum: 99 }
                      optionIds: { type: array, items: { type: integer } }
                      note: { type: string, maxLength: 200 }
      responses:
        '200':
          description: สำเร็จ
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/PublicOrderPreview' }
        '404': { description: ไม่พบโต๊ะนี้ / โต๊ะหรือสาขาปิดใช้งานอยู่ }
        '409': { description: เมนูปิดขายอยู่ / ตัวเลือกไม่ครบตามที่กำหนด }
        '422': { description: ข้อมูลที่ส่งมาไม่ถูกต้อง }
        '429': { description: ทำรายการถี่เกินไป }
