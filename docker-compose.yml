# รันทั้งระบบด้วยคำสั่งเดียว:  docker compose up --build
#   - เว็บผู้ดูแลระบบ/หน้าร้าน : http://localhost:8080
#   - REST API + เอกสาร        : http://localhost:3000/docs
# ต้องตั้ง JWT_SECRET ก่อน (ไม่มีค่าสำรองในไฟล์นี้) — สร้างไฟล์ .env ข้างไฟล์นี้ แล้วใส่บรรทัด
#   JWT_SECRET=<ค่าสุ่มจาก openssl rand -hex 32>
services:
  api:
    build:
      context: ./backend
    container_name: payneat-api
    environment:
      # ค่าเริ่มต้นคือรันดูในเครื่องด้วยบัญชีเดโม (admin/admin123 ฯลฯ) — production จะไม่ยอม seed บัญชีด้วย
      # รหัสผ่านเดโมที่เผยแพร่อยู่ (SECURITY.md) เดิมตั้ง production ตายตัวไว้ API จึงไม่ยอมสตาร์ตเลย
      # deploy จริง: NODE_ENV=production + SEED_*_PASSWORD ครบ 6 ตัว + JWT_SECRET/CORS_ORIGIN ของจริง
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # ไม่ตั้งค่า = compose หยุดพร้อมข้อความนี้ ใน production ค่าต้องสุ่มเองและยาวอย่างน้อย 32 ตัว (DECISIONS #83)
      JWT_SECRET: ${JWT_SECRET:?ตั้ง JWT_SECRET ก่อน - สร้างไฟล์ .env ข้าง docker-compose.yml แล้วใส่ JWT_SECRET=ค่าจาก openssl rand -hex 32}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      AUTO_SEED: "true"
      DATABASE_FILE: data/payneat.sqlite
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-}
      SEED_WAITER1_PASSWORD: ${SEED_WAITER1_PASSWORD:-}
      SEED_WAITER2_PASSWORD: ${SEED_WAITER2_PASSWORD:-}
      SEED_KITCHEN_PASSWORD: ${SEED_KITCHEN_PASSWORD:-}
      SEED_CASHIER_PASSWORD: ${SEED_CASHIER_PASSWORD:-}
      # ตาชั่งสด/ส่งอีเมลปิดไว้เป็นค่าเริ่มต้น (เหมือน backend/.env.example) — เดโมโดยไม่มีตาชั่ง/SMTP จริง
      # ให้สร้างไฟล์ .env ข้าง docker-compose.yml นี้ ใส่ SCALE_DRIVER=simulator กับ MAIL_TRANSPORT=json
      # (compose อ่านไฟล์นั้นให้เอง) — ห้ามตั้ง simulator ในร้านจริง เพราะน้ำหนักเป็นตัวเลขจำลอง
      SCALE_DRIVER: ${SCALE_DRIVER:-off}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      # log JSON ตามสัญญา telemetry (ticket 24) — ดูด้วย `docker compose logs api`
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-default}
      # /metrics อยู่พอร์ต 9464 ในคอนเทนเนอร์ และตั้งใจไม่เปิดออกนอกเครื่อง (ห้ามเปิดสาธารณะ — DECISIONS #68)
      # ฟังทุก interface ของคอนเทนเนอร์ ตัวเก็บ metric ใน compose network เดียวกันจึงเรียก http://api:9464/metrics ได้
      # (นอก Docker ค่าเริ่มต้นคือ 127.0.0.1)
      METRICS_HOST: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - payneat-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./app
      args:
        # เบราว์เซอร์ของผู้ใช้เป็นคนเรียก API จึงต้องชี้มาที่ localhost ของเครื่องเขา
        API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
        DEMO_MODE: "false"
    container_name: payneat-web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  payneat-data:
